<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albury Wodonga අවුරුදු උළෙල 2026 — Collection Status</title>
  <style>
    :root {
      --primary:   #c0392b;
      --accent:    #e67e22;
      --gold:      #f1c40f;
      --bg:        #fdf6ec;
      --card:      #ffffff;
      --text:      #2c3e50;
      --muted:     #7f8c8d;
      --border:    #e0d6c8;
      --bar-bg:    #d6ede1;
      --bar-fill:  linear-gradient(90deg, #1a7a4a 0%, #27ae60 55%, #58d68d 100%);
      --shadow:    0 4px 18px rgba(0,0,0,0.08);
      --radius:    14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #8B0000 0%, #c0392b 50%, #e67e22 100%);
      color: #fff;
      text-align: center;
      padding: 36px 20px 28px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header .flag-strip {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 28px;
    }
    header h1 {
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    header h1 span {
      display: block;
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 400;
      opacity: 0.9;
      margin-top: 4px;
    }
    .last-updated {
      margin-top: 10px;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* ── Main layout ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 26px 28px;
      margin-bottom: 22px;
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Progress bar ── */
    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .amount-collected {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }
    .amount-collected sup { font-size: 0.5em; vertical-align: top; margin-top: 6px; display: inline-block; }
    .goal-label {
      text-align: right;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .goal-label strong { color: var(--text); font-size: 1.1rem; }

    .progress-wrap {
      background: var(--bar-bg);
      border-radius: 999px;
      height: 22px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--bar-fill);
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 60%);
      border-radius: 999px;
    }
    .progress-pct {
      text-align: right;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1a7a4a;
    }

    /* ── Stats grid (meal/misc totals) ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 14px;
      margin-bottom: 0;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 14px;
      text-align: center;
    }
    .stat-icon { font-size: 1.6rem; margin-bottom: 6px; }
    .stat-value {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── Category breakdown table ── */
    .cat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .cat-table thead th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0 10px 10px 0;
      border-bottom: 1.5px solid var(--border);
    }
    .cat-table thead th:last-child { text-align: right; padding-right: 0; }
    .cat-table tbody tr { border-bottom: 1px solid var(--border); }
    .cat-table tbody tr:last-child { border-bottom: none; }
    .cat-table td {
      padding: 10px 10px 10px 0;
      vertical-align: middle;
    }
    .cat-table td:last-child { padding-right: 0; }
    .cat-label { font-weight: 600; color: var(--text); }
    .cat-bar-wrap {
      background: #e8f5ee;
      border-radius: 999px;
      height: 8px;
      width: 100%;
      min-width: 60px;
      overflow: hidden;
    }
    .cat-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1a7a4a, #27ae60);
      transition: width 1s cubic-bezier(0.22,1,0.36,1);
    }
    .cat-fraction {
      text-align: right;
      white-space: nowrap;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    .cat-fraction .paid-num { color: #1a7a4a; }
    .cat-fraction .sep { color: var(--muted); margin: 0 1px; }
    .cat-fraction .total-num { color: var(--muted); font-weight: 500; }

    /* ── Search ── */
    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-row input {
      flex: 1;
      min-width: 180px;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg);
    }
    .search-row input:focus { border-color: var(--primary); }
    .search-row button {
      padding: 12px 22px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-row button:hover { background: #a93226; }

    /* ── Search results ── */
    #search-results { margin-top: 18px; }

    .result-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 12px;
      background: var(--bg);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .result-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }
    .result-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .pill-adults    { background: #eaf4fb; color: #2471a3; border: 1px solid #aed6f1; }
    .pill-kids      { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
    .pill-chicken   { background: #fef9e7; color: #9a7d0a; border: 1px solid #f9e79f; }
    .pill-veg       { background: #f4ecf7; color: #7d3c98; border: 1px solid #d7bde2; }
    .pill-amount    { background: #fdf2f0; color: var(--primary); border: 1px solid #f5b7b1; }
    .pill-status    { background: #e8f8f5; color: #1a7a5e; border: 1px solid #a2d9ce; }
    .pill-status.pending { background: #fef5e7; color: #9a5000; border: 1px solid #fad7a0; }

    .no-result {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
      font-size: 0.95rem;
    }

    /* ── Loading spinner ── */
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      padding: 24px 0;
      color: var(--muted);
    }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-msg {
      background: #fdf0ef;
      border: 1px solid #f5b7b1;
      border-radius: 8px;
      padding: 14px 18px;
      color: var(--primary);
      font-size: 0.9rem;
    }

    /* ── Refresh button ── */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .refresh-btn:hover { border-color: var(--primary); color: var(--primary); }
    .refresh-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Recent payments ── */
    .recent-list { list-style: none; }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .recent-item:last-child { border-bottom: none; }
    .recent-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .recent-info { flex: 1; min-width: 0; }
    .recent-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-time {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .recent-amount {
      font-weight: 700;
      font-size: 1rem;
      color: #1a7a4a;
      white-space: nowrap;
    }
    .recent-status {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .recent-status.paid   { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
    .recent-status.pending{ background: #fef5e7; color: #9a5000; border: 1px solid #fad7a0; }

    @media (max-width: 540px) {
      header { padding: 24px 16px 20px; }
      header .flag-strip { font-size: 22px; margin-bottom: 10px; }
      main { padding: 16px 12px 48px; }
      .card { padding: 16px 14px; margin-bottom: 14px; }
      .amount-collected { font-size: 2.2rem; }
      .goal-header { flex-direction: column; align-items: flex-start; }
      .goal-label { text-align: left; }
      .progress-wrap { height: 26px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-box { padding: 14px 10px; }
      .stat-value { font-size: 1.6rem; }
      .search-row { flex-direction: column; }
      .search-row input,
      .search-row button { width: 100%; min-width: unset; }
      .search-row button { padding: 14px; font-size: 1rem; }
      .pill { font-size: 0.75rem; padding: 4px 10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="flag-strip">🇱🇰 🎉 🇦🇺</div>
  <h1>
    Albury Wodonga
    <span>අවුරුදු උළෙල 2026 — Collection Status</span>
  </h1>
  <div class="last-updated" id="last-updated">Loading…</div>
</header>

<main>

  <!-- ── Progress card ── -->
  <div class="card" id="progress-card">
    <div class="card-title">Fundraising Progress</div>
    <div id="progress-content">
      <div class="loading"><div class="spinner"></div> Fetching data…</div>
    </div>
  </div>

  <!-- ── Category breakdown card ── -->
  <div class="card" id="categories-card">
    <div class="card-title">Payment Progress by Category</div>
    <div id="categories-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ── Stats card ── -->
  <div class="card" id="stats-card">
    <div class="card-title">Meal Summary</div>
    <div id="stats-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ── Search card ── -->
  <div class="card">
    <div class="card-title">Search by Name</div>
    <div class="search-row">
      <input
        type="text"
        id="search-input"
        placeholder="Enter name…"
        autocomplete="off"
        autocorrect="off"
      />
      <button id="search-btn">Search</button>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- ── Recent payments card ── -->
  <div class="card">
    <div class="card-title">Recent Payments</div>
    <div id="recent-content">
      <div class="loading"><div class="spinner"></div> Fetching…</div>
    </div>
  </div>

</main>

<script>
  // ── Config ──────────────────────────────────────────────────────
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTASCJOiQyBHPwqpw78AHQLYtEZdmIwI2IF5W60ynU0RWPPaVNU_pk-UOOd8kGIUZA/exec';
  const GOAL       = 3254.5;

  // ── Helpers ─────────────────────────────────────────────────────
  const fmt  = n => Number(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtN = n => Number(n).toLocaleString('en-AU');

  function setEl(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── Load summary ─────────────────────────────────────────────────
  async function loadSummary() {
    try {
      const data = await fetchJSON(`${SCRIPT_URL}?action=summary`);
      if (data.error) throw new Error(data.error);

      const collected = parseFloat(data.totalCollected) || 0;
      const pct       = Math.min((collected / GOAL) * 100, 100).toFixed(1);
      const remaining = Math.max(GOAL - collected, 0);

      // Progress card
      setEl('progress-content', `
        <div class="goal-header">
          <div class="amount-collected"><sup>$</sup>${fmt(collected)}</div>
          <div class="goal-label">
            Goal <strong>$${fmt(GOAL)}</strong><br>
            <span style="color:var(--accent)">$${fmt(remaining)} to go</span>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-fill" id="bar" style="width:0%"></div>
        </div>
        <div class="progress-pct">${pct}% reached</div>
      `);
      // Animate bar after paint
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const bar = document.getElementById('bar');
        if (bar) bar.style.width = pct + '%';
      }));

      // Category breakdown card (from Sheet 3)
      const cats = Array.isArray(data.categories) ? data.categories : [];
      if (cats.length) {
        const rows = cats.map(c => {
          const pct = c.total > 0 ? Math.round((c.paid / c.total) * 100) : 0;
          return `
            <tr>
              <td class="cat-label">${c.label}</td>
              <td style="width:40%;padding-right:14px">
                <div class="cat-bar-wrap">
                  <div class="cat-bar-fill" style="width:${pct}%"></div>
                </div>
              </td>
              <td class="cat-fraction">
                <span class="paid-num">${c.paid}</span><span class="sep">/</span><span class="total-num">${c.total}</span>
              </td>
            </tr>`;
        }).join('');
        setEl('categories-content', `
          <table class="cat-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Progress</th>
                <th style="text-align:right">Paid / Total</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `);
        // Animate bars after paint
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.querySelectorAll('.cat-bar-fill').forEach(b => {
            b.style.width = b.style.width; // trigger reflow already set
          });
        }));
      } else {
        setEl('categories-content', '<div class="no-result">No category data found in Sheet 3.</div>');
      }

      // Stats card (meal totals)
      setEl('stats-content', `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-icon">👥</div>
            <div class="stat-value">${fmtN(data.donorCount)}</div>
            <div class="stat-label">Families</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon">🧑</div>
            <div class="stat-value">${fmtN(data.totalAdults)}</div>
            <div class="stat-label">Adults</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon">👧</div>
            <div class="stat-value">${fmtN(data.totalKids)}</div>
            <div class="stat-label">Children</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon">🍗</div>
            <div class="stat-value">${fmtN(data.totalChicken)}</div>
            <div class="stat-label">Chicken</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon">🥗</div>
            <div class="stat-value">${fmtN(data.totalVeg)}</div>
            <div class="stat-label">Vegetarian</div>
          </div>
        </div>
      `);

      // Timestamp
      setEl('last-updated', `Last updated: ${new Date().toLocaleString('en-AU')}`);

    } catch (err) {
      setEl('progress-content', `<div class="error-msg">⚠️ Could not load data — ${err.message}</div>`);
      setEl('categories-content', '');
      setEl('stats-content', '');
      setEl('last-updated', 'Failed to load');
    }
  }

  // ── Search ───────────────────────────────────────────────────────
  async function doSearch() {
    const query = document.getElementById('search-input').value.trim();
    const out   = document.getElementById('search-results');
    if (!query) { out.innerHTML = ''; return; }

    out.innerHTML = '<div class="loading"><div class="spinner"></div> Searching…</div>';

    try {
      const data = await fetchJSON(`${SCRIPT_URL}?action=search&name=${encodeURIComponent(query)}`);
      if (data.error) throw new Error(data.error);

      const rows = Array.isArray(data.results) ? data.results : [];
      if (!rows.length) {
        out.innerHTML = '<div class="no-result">No matching records found.</div>';
        return;
      }

      out.innerHTML = rows.map(r => {
        const kids     = (parseInt(r.kids12) || 0) + (parseInt(r.kidsU12) || 0);
        const statusCls = (r.status || '').toLowerCase().includes('paid') ? '' : ' pending';
        return `
          <div class="result-card">
            <div class="result-name">👤 ${r.name}</div>
            <div class="result-pills">
              ${r.adults   > 0 ? `<span class="pill pill-adults">🧑 ${r.adults} Adult${r.adults!=1?'s':''}</span>` : ''}
              ${kids       > 0 ? `<span class="pill pill-kids">👧 ${kids} Child${kids!=1?'ren':''}</span>` : ''}
              ${r.chicken  > 0 ? `<span class="pill pill-chicken">🍗 ${r.chicken} Chicken</span>` : ''}
              ${r.veg      > 0 ? `<span class="pill pill-veg">🥗 ${r.veg} Vegetarian</span>` : ''}
              ${r.amount      ? `<span class="pill pill-amount">💰 $${fmt(r.amount)}</span>` : ''}
              ${r.status      ? `<span class="pill pill-status${statusCls}">✅ ${r.status}</span>` : ''}
            </div>
          </div>`;
      }).join('');

    } catch (err) {
      out.innerHTML = `<div class="error-msg">⚠️ Search failed — ${err.message}</div>`;
    }
  }

  // ── Recent payments ──────────────────────────────────────────────
  async function loadRecent() {
    try {
      const data = await fetchJSON(`${SCRIPT_URL}?action=recent`);
      if (data.error) throw new Error(data.error);

      const rows = Array.isArray(data.results) ? data.results : [];
      if (!rows.length) {
        setEl('recent-content', '<div class="no-result">No payments recorded yet.</div>');
        return;
      }

      const items = rows.map(r => {
        const initials = (r.name || '?').trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const ts       = r.timestamp ? new Date(r.timestamp).toLocaleString('en-AU', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
        const isPaid   = (r.status || '').toLowerCase().includes('paid');
        const statusCls = isPaid ? 'paid' : 'pending';
        const amountHtml = r.amount ? `<div class="recent-amount">$${fmt(r.amount)}</div>` : '';
        return `
          <li class="recent-item">
            <div class="recent-avatar">${initials}</div>
            <div class="recent-info">
              <div class="recent-name">${r.name}</div>
              <div class="recent-time">${ts}</div>
            </div>
            ${amountHtml}
            ${r.status ? `<span class="recent-status ${statusCls}">${r.status}</span>` : ''}
          </li>`;
      }).join('');

      setEl('recent-content', `<ul class="recent-list">${items}</ul>`);
    } catch (err) {
      setEl('recent-content', `<div class="error-msg">⚠️ Could not load recent payments — ${err.message}</div>`);
    }
  }

  // ── Events ───────────────────────────────────────────────────────
  document.getElementById('search-btn').addEventListener('click', doSearch);
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  // ── Init ─────────────────────────────────────────────────────────
  loadSummary();
  loadRecent();
</script>

</body>
</html>
